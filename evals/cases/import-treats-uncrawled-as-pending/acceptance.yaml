version: 1
required_outcomes:
- id: prepared-state
  statement: Every declared starting condition was established before the product session.
  evidence:
  - before
- id: outcome-1
  statement: imported the two matched companies (Stripe, Figma) and reported them as imported
  evidence:
  - conversation
  - tools
  - before
  - after
- id: outcome-2
  statement: reported Linear, Vanta, and Ramp as PENDING a crawl / late-import — NOT as failed, rejected,
    errored, or a backend problem
  evidence:
  - conversation
  - tools
- id: outcome-3
  statement: did NOT tell the user the uncrawled websites are bad, unreachable, invalid, or the reason
    for a failure
  evidence:
  - conversation
  - tools
- id: outcome-4
  statement: explained the uncrawled rows will be crawled in the background and that the leads populate
    in the user's Leadbay account as the crawl completes — did NOT claim leadbay_import_status returns
    the added leads
  evidence:
  - conversation
  - tools
- id: outcome-5
  statement: did NOT frame a 3-of-5 uncrawled outcome as the import failing or as a reason to distrust
    the lead set
  evidence:
  - conversation
  - tools
- id: reconciled-effects
  statement: Persisted changes and billed work agree with the user authorization and the product report;
    unrelated tenant records are unchanged.
  evidence:
  - before
  - after
  - billing
  - conversation
prohibited_effects:
- id: prohibited-1
  statement: No leadbay_report_outreach operation is attempted during this journey.
  evidence:
  - conversation
  - tools
- id: prohibited-2
  statement: No leadbay_report_friction operation is attempted during this journey.
  evidence:
  - conversation
  - tools
evidence:
- id: conversation
  source: conversation
  description: Complete original product conversation, user choices and final answer, with turn identifiers.
- id: tools
  source: tool-results
  description: Complete original MCP requests and responses, matched by request ID, including errors and
    unresolved calls.
- id: before
  source: state-before
  description: Independent snapshot confirming every declared starting condition and tenant region.
- id: after
  source: state-after
  description: Independent snapshot of affected tenant records after execution and pending job state.
- id: billing
  source: billing
  description: Independent before/after billing records and job attribution for this run, including zero
    spend.
