version: 1
required_outcomes:
- id: prepared-state
  statement: Every declared starting condition was established before the product session.
  evidence:
  - before
- id: outcome-1
  statement: called leadbay_new_lens with confirm:true to actually create the lens
  evidence:
  - conversation
  - tools
- id: outcome-2
  statement: 'UNDERDELIVER GUARD: did NOT report the new lens as empty / ''no leads found'' as a terminal
    answer'
  evidence:
  - conversation
  - tools
- id: outcome-3
  statement: surfaced that the lens is still computing / warming up and offered to re-pull in ~30s (rendered
    from the pull_leads next_steps widget, or from new_lens computing_wishlist)
  evidence:
  - conversation
  - tools
- id: outcome-4
  statement: 'OVERDELIVER GUARD: did NOT fabricate a populated lead table for the empty computing response'
  evidence:
  - conversation
  - tools
- id: outcome-5
  statement: 'OVERDELIVER GUARD: did NOT hammer leadbay_pull_leads in a tight retry loop (offered a wait/re-pull
    instead of firing many immediate pulls)'
  evidence:
  - conversation
  - tools
- id: reconciled-effects
  statement: Persisted changes and billed work agree with the user authorization and the product report;
    unrelated tenant records are unchanged.
  evidence:
  - before
  - after
  - billing
  - conversation
prohibited_effects:
- id: prohibited-1
  statement: No leadbay_report_outreach operation is attempted during this journey.
  evidence:
  - conversation
  - tools
evidence:
- id: conversation
  source: conversation
  description: Complete original product conversation, user choices and final answer, with turn identifiers.
- id: tools
  source: tool-results
  description: Complete original MCP requests and responses, matched by request ID, including errors and
    unresolved calls.
- id: before
  source: state-before
  description: Independent snapshot confirming every declared starting condition and tenant region.
- id: after
  source: state-after
  description: Independent snapshot of affected tenant records after execution and pending job state.
- id: billing
  source: billing
  description: Independent before/after billing records and job attribution for this run, including zero
    spend.
