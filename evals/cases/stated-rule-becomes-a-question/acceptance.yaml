version: 1
required_outcomes:
- id: prepared-state
  statement: Every declared starting condition was established before the product session.
  evidence:
  - before
- id: outcome-1
  statement: The org's qualification settings were read before anything was proposed.
  evidence:
  - tools
- id: outcome-2
  statement: The liquidation rule was proposed to the user as a durable org-level qualification question,
    with its exact text shown, rather than applied only to the current batch of leads.
  evidence:
  - conversation
  - tools
- id: outcome-3
  statement: No qualification question was written before the user's approving reply.
  evidence:
  - conversation
  - tools
- id: outcome-4
  statement: After the approving reply, the org's qualification question rows changed, and the added
    question is phrased estimatively and names no specific company.
  evidence:
  - tools
  - after
- id: outcome-5
  statement: GROUPE SOLIDUM was handled as one named account rather than as an org-level setting.
  evidence:
  - conversation
  - tools
- id: reconciled-effects
  statement: Persisted changes agree with the user authorization and the product report; unrelated tenant
    records, the lens filters and the targeting prompt are unchanged except where the report says otherwise.
  evidence:
  - before
  - after
  - conversation
prohibited_effects:
- id: prohibited-1
  statement: No qualification question containing a company name was written.
  evidence:
  - tools
  - after
- id: prohibited-2
  statement: No existing qualification question was removed or reworded.
  evidence:
  - before
  - after
evidence:
- id: conversation
  source: conversation
  description: Complete original product conversation, user choices and final answer, with turn identifiers.
- id: tools
  source: tool-results
  description: Complete original MCP requests and responses, matched by request ID, including errors and
    unresolved calls.
- id: before
  source: state-before
  description: Independent snapshot confirming every declared starting condition and tenant region.
- id: after
  source: state-after
  description: Independent snapshot of affected tenant records after execution and pending job state.
