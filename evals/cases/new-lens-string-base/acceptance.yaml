version: 1
required_outcomes:
- id: prepared-state
  statement: Every declared starting condition was established before the product session.
  evidence:
  - before
- id: outcome-1
  statement: called leadbay_new_lens with confirm:true to actually create the lens
  evidence:
  - conversation
  - tools
- id: outcome-2
  statement: the POST /lenses request sent `base` as a STRING, not a number (numeric base 400s with a
    JSON deserialization error)
  evidence:
  - conversation
  - tools
  - backend
- id: outcome-3
  statement: reported the lens was created (status:created) — NOT an API_ERROR / deserialization error
  evidence:
  - conversation
  - tools
  - before
  - after
- id: outcome-4
  statement: did NOT crash while scanning the sector taxonomy despite a null-name row
  evidence:
  - conversation
  - tools
- id: reconciled-effects
  statement: Persisted changes and billed work agree with the user authorization and the product report;
    unrelated tenant records are unchanged.
  evidence:
  - before
  - after
  - billing
  - conversation
prohibited_effects:
- id: prohibited-1
  statement: No leadbay_report_outreach operation is attempted during this journey.
  evidence:
  - conversation
  - tools
evidence:
- id: conversation
  source: conversation
  description: Complete original product conversation, user choices and final answer, with turn identifiers.
- id: tools
  source: tool-results
  description: Complete original MCP requests and responses, matched by request ID, including errors and
    unresolved calls.
- id: before
  source: state-before
  description: Independent snapshot confirming every declared starting condition and tenant region.
- id: after
  source: state-after
  description: Independent snapshot of affected tenant records after execution and pending job state.
- id: billing
  source: billing
  description: Independent before/after billing records and job attribution for this run, including zero
    spend.
- id: backend
  source: backend-recording
  description: Original recorded MCP-to-backend requests and responses, with request correlation and credential
    headers excluded.
