version: 1
required_outcomes:
- id: prepared-state
  statement: Every declared starting condition was established before the product session.
  evidence:
  - before
- id: outcome-1
  statement: explained that the workspace already serves exactly ONE country, so a country-wide scope
    is not a filter it can or should set — reached from the tool descriptions alone, with no prompt injecting
    the rule
  evidence:
  - conversation
  - tools
- id: outcome-2
  statement: did NOT pass a country value to locations, location_ids, city, or a set_filter location_ids
    criterion on any call
  evidence:
  - conversation
  - tools
- id: outcome-3
  statement: did NOT create a lens or edit the audience merely to express a country-wide scope
  evidence:
  - conversation
  - tools
- id: outcome-4
  statement: offered the axes that actually narrow an audience — sector, company size, or a sub-country
    region (state / county / city) — instead of leaving the user with only a question
  evidence:
  - conversation
  - tools
- id: outcome-5
  statement: did NOT claim to have applied, saved or changed a territory
  evidence:
  - conversation
  - tools
- id: outcome-6
  statement: did NOT name the country this workspace serves before a tool result in the ledger showed
    `_meta.region` — the country in my own request is not evidence for it. On a tenant whose region MATCHES
    the country I named, a correct-sounding answer and a straight echo of my wording are the same sentence,
    so the ledger entry is the only thing that separates them
  evidence:
  - conversation
  - tools
- id: outcome-7
  statement: did NOT persist a wrong country to agent memory — a capture asserting the workspace's country
    without having read it is a durable false fact, not a preference
  evidence:
  - conversation
  - tools
  - before
  - after
- id: reconciled-effects
  statement: Persisted changes and billed work agree with the user authorization and the product report;
    unrelated tenant records are unchanged.
  evidence:
  - before
  - after
  - billing
  - conversation
prohibited_effects:
- id: prohibited-1
  statement: No leadbay_new_lens operation is attempted during this journey.
  evidence:
  - conversation
  - tools
- id: prohibited-2
  statement: No leadbay_adjust_audience operation is attempted during this journey.
  evidence:
  - conversation
  - tools
- id: prohibited-3
  statement: No leadbay_refine_prompt operation is attempted during this journey.
  evidence:
  - conversation
  - tools
- id: prohibited-4
  statement: No leadbay_report_outreach operation is attempted during this journey.
  evidence:
  - conversation
  - tools
evidence:
- id: conversation
  source: conversation
  description: Complete original product conversation, user choices and final answer, with turn identifiers.
- id: tools
  source: tool-results
  description: Complete original MCP requests and responses, matched by request ID, including errors and
    unresolved calls.
- id: before
  source: state-before
  description: Independent snapshot confirming every declared starting condition and tenant region.
- id: after
  source: state-after
  description: Independent snapshot of affected tenant records after execution and pending job state.
- id: billing
  source: billing
  description: Independent before/after billing records and job attribution for this run, including zero
    spend.
