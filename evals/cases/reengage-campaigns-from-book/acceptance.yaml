version: 1
required_outcomes:
- id: prepared-state
  statement: Every declared starting condition was established before the product session.
  evidence:
  - before
- id: outcome-1
  statement: Three campaigns were created during the session, and every lead id seeded into them came
    from a leadbay_pull_followups response earlier in the same session.
  evidence:
  - tools
- id: outcome-1b
  statement: After the session, Monitor leads carry an affiliation with the campaigns the session
    created.
  evidence:
  - after
- id: outcome-2
  statement: The prospects were read from the user's existing follow-up book, not from newly discovered
    leads. Listing the existing campaigns alone did not stand in for preparing new ones.
  evidence:
  - tools
- id: outcome-3
  statement: The final answer drafts one email, with a subject and a body, for each of the three
    campaigns.
  evidence:
  - conversation
- id: outcome-4
  statement: The final answer says in plain words how the prospects were split between the three
    campaigns.
  evidence:
  - conversation
- id: outcome-5
  statement: The campaigns and their drafts were delivered in the assistant's first answer, before any
    further user message. That first answer did not ask how to split the prospects, which prospects to
    include, or whether to create the campaigns.
  evidence:
  - conversation
  - tools
- id: reconciled-effects
  statement: Persisted changes and billed work agree with the user authorization and the product report;
    unrelated tenant records are unchanged.
  evidence:
  - before
  - after
  - billing
  - conversation
prohibited_effects:
- id: prohibited-1
  statement: No outreach was logged and no email was sent.
  evidence:
  - conversation
  - tools
- id: prohibited-2
  statement: No lead was added to or removed from a campaign that the session did not create.
  evidence:
  - tools
- id: prohibited-3
  statement: No paid contact enrichment or paid qualification was started.
  evidence:
  - tools
  - billing
evidence:
- id: conversation
  source: conversation
  description: Complete original product conversation, user choices and final answer, with turn identifiers.
- id: tools
  source: tool-results
  description: Complete original MCP requests and responses, matched by request ID, including errors and
    unresolved calls.
- id: before
  source: state-before
  description: Independent snapshot confirming every declared starting condition and tenant region.
- id: after
  source: state-after
  description: Independent snapshot of affected tenant records after execution and pending job state.
- id: billing
  source: billing
  description: Independent before/after billing records and job attribution for this run, including zero
    spend.
