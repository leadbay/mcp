version: 1
required_outcomes:
- id: prepared-state
  statement: Every declared starting condition was established before the product session.
  evidence:
  - before
- id: outcome-1
  statement: called leadbay_pull_leads exactly once to get today's Discover batch
  evidence:
  - conversation
  - tools
- id: outcome-2
  statement: 'rendered the leads in the EXACT order the tool returned them: AVILINE first, then BRIDGEWELL,
    then CALDERA'
  evidence:
  - conversation
  - tools
- id: outcome-3
  statement: did NOT re-sort the table by score (a score-desc re-sort would wrongly put BRIDGEWELL first
    and AVILINE last)
  evidence:
  - conversation
  - tools
- id: outcome-4
  statement: kept AVILINE ahead of the higher-scored leads because it is the new-today lead — matching
    the UI's Discover order
  evidence:
  - conversation
  - tools
- id: outcome-5
  statement: did NOT print the raw numeric score in the table
  evidence:
  - conversation
  - tools
- id: reconciled-effects
  statement: Persisted changes and billed work agree with the user authorization and the product report;
    unrelated tenant records are unchanged.
  evidence:
  - before
  - after
  - billing
  - conversation
prohibited_effects:
- id: prohibited-1
  statement: No leadbay_report_outreach operation is attempted during this journey.
  evidence:
  - conversation
  - tools
evidence:
- id: conversation
  source: conversation
  description: Complete original product conversation, user choices and final answer, with turn identifiers.
- id: tools
  source: tool-results
  description: Complete original MCP requests and responses, matched by request ID, including errors and
    unresolved calls.
- id: before
  source: state-before
  description: Independent snapshot confirming every declared starting condition and tenant region.
- id: after
  source: state-after
  description: Independent snapshot of affected tenant records after execution and pending job state.
- id: billing
  source: billing
  description: Independent before/after billing records and job attribution for this run, including zero
    spend.
