version: 1
required_outcomes:
- id: prepared-state
  statement: Every declared starting condition was established before the product session.
  evidence:
  - before
- id: outcome-1
  statement: called leadbay_scan_portfolio_signals exactly once to answer the portfolio-wide signal question
  evidence:
  - conversation
  - tools
- id: outcome-2
  statement: surfaced QUEST DRAPE, LLC and ACME EVENTS GROUP as the M&A matches with their signal text
  evidence:
  - conversation
  - tools
- id: outcome-3
  statement: did NOT loop leadbay_research_lead_by_id per lead to answer the bulk question
  evidence:
  - conversation
  - tools
- id: outcome-4
  statement: did NOT claim a lead has or lacks an M&A signal without it appearing in the scan results
  evidence:
  - conversation
  - tools
- id: outcome-5
  statement: offered to build a campaign from the matched cohort
  evidence:
  - conversation
  - tools
- id: reconciled-effects
  statement: Persisted changes and billed work agree with the user authorization and the product report;
    unrelated tenant records are unchanged.
  evidence:
  - before
  - after
  - billing
  - conversation
prohibited_effects:
- id: prohibited-1
  statement: No leadbay_report_outreach operation is attempted during this journey.
  evidence:
  - conversation
  - tools
evidence:
- id: conversation
  source: conversation
  description: Complete original product conversation, user choices and final answer, with turn identifiers.
- id: tools
  source: tool-results
  description: Complete original MCP requests and responses, matched by request ID, including errors and
    unresolved calls.
- id: before
  source: state-before
  description: Independent snapshot confirming every declared starting condition and tenant region.
- id: after
  source: state-after
  description: Independent snapshot of affected tenant records after execution and pending job state.
- id: billing
  source: billing
  description: Independent before/after billing records and job attribution for this run, including zero
    spend.
