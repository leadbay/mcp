  - conversation
  - tools
- id: outcome-10
  statement: 'After the user says "Draft the first email": did NOT send the draft or offer to send it'
  evidence:
  - conversation
  - tools
- id: outcome-11
  statement: 'After the user says "Find who to email": ran ONLY the free mode:''discover'' preview — it
    was never told to confirm, so it must not have launched the paid reveal'
  evidence:
  - conversation
  - tools
  - billing
  - before
  - after
- id: outcome-12
  statement: 'After the user says "Find who to email": said plainly that nothing had been spent'
  evidence:
  - conversation
  - tools
  - billing
- id: outcome-13
  statement: 'After the user says "Find who to email": did NOT claim to have revealed, unlocked or found
    any email address or phone number'
  evidence:
  - conversation
  - tools
- id: outcome-14
  statement: 'After the user says "I''m done for now": closed with the keep_going cheat-sheet AND the
    1:1 offer carrying the Calendly link'
  evidence:
  - conversation
  - tools
- id: outcome-15
  statement: 'After the user says "I''m done for now": kept the offer to about one sentence — it did not
    turn into a pitch or re-open the tour'
  evidence:
  - conversation
  - tools
- id: host-rendering
  statement: The user can see and act on the offered choices in the actual declared host.
