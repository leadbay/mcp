name: eval-release-gate
# A release PR is the one that bumps packages/mcp/package.json (auto-tag reads that file on main).
# Every live journey in the release set must pass the contracts gate on both prod tenants before merge.
on:
  pull_request:
    paths: [packages/mcp/package.json]
  workflow_dispatch:
    inputs:
      env:
        description: Tenant environment
        default: prod-us
        type: choice
        options: [prod-us, prod-fr, staging-us, staging-fr]
      cases:
        description: Comma-separated case ids (case:variant allowed)
        required: true
permissions:
  contents: read
jobs:
  release-pr:
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.check.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo bump=true >> "$GITHUB_OUTPUT"; exit 0; fi
          base=$(git show "origin/${{ github.base_ref }}:packages/mcp/package.json" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          head=$(node -pe 'require("./packages/mcp/package.json").version')
          echo "base=$base head=$head"
          [ "$base" != "$head" ] && echo bump=true >> "$GITHUB_OUTPUT" || echo bump=false >> "$GITHUB_OUTPUT"
  journeys:
    needs: release-pr
    if: needs.release-pr.outputs.bump == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: prod-us
            cases: us-wide-followups-omits-geo,pull-leads-offers-enrich-top-leads,scan-finds-ma-cohort,scan-honest-about-unresearched,enrich-titles-linkedin-only-no-spend,lead-delivery-routing-1,lead-delivery-routing-2,new-lens-string-base,new-lens-warmup,import-treats-uncrawled-as-pending,getting-started-completes-all-gates,getting-started-no-unprompted-enrich-spend,country-scope-writes-nothing
          - env: prod-fr
            cases: country-scope-writes-nothing:foreign-country,us-wide-followups-omits-geo,pull-leads-renders-in-tool-order,adjust-audience-dirty-taxonomy,lead-delivery-routing-3
    # One journey at a time per tenant, across every PR: two release PRs must not share before/after evidence.
    concurrency:
      group: eval-tenant-${{ github.event_name == 'workflow_dispatch' && inputs.env || matrix.env }}
      cancel-in-progress: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
      LEADBAY_EMAIL: ${{ secrets.EVAL_LEADBAY_EMAIL }}
      LEADBAY_PASSWORD: ${{ secrets.EVAL_LEADBAY_PASSWORD }}
      EVAL_SUBJECT_MODEL: claude-sonnet-5
      EVAL_EXECUTOR_MODEL: claude-sonnet-5
      EVAL_VERIFIER_MODEL: claude-sonnet-5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install PyYAML==6.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: docker compose -f .github/evals/compose.yaml build contracts
      - name: Run the lane
        shell: bash
        run: |
          env="${{ github.event_name == 'workflow_dispatch' && inputs.env || matrix.env }}"
          cases="${{ github.event_name == 'workflow_dispatch' && inputs.cases || matrix.cases }}"
          python .github/evals/lane.py --env "$env" --cases "$cases" --out "$RUNNER_TEMP/journeys"
      # Evidence bundles hold tenant data and stay on the runner. Only verdicts are kept, for a week.
      - if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/verdicts"
          for d in "$RUNNER_TEMP"/journeys/*/; do
            [ -f "$d/verdict.yaml" ] && cp "$d/verdict.yaml" "$RUNNER_TEMP/verdicts/$(basename "$d").verdict.yaml"
          done
          ls "$RUNNER_TEMP/verdicts" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-${{ github.event_name == 'workflow_dispatch' && inputs.env || matrix.env }}
          path: ${{ runner.temp }}/verdicts
          retention-days: 7
          if-no-files-found: ignore
